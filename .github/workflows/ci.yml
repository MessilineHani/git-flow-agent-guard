name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov

      - name: Run lint (ruff)
        run: ruff check scripts/

      - name: Run typecheck (mypy)
        run: mypy scripts/lib/guard.py

      - name: Run tests (pytest)
        run: pytest tests/ -v --cov=scripts/lib --cov-report=term-missing

      - name: Run build verification
        run: python -m py_compile scripts/analyze-pull.py scripts/evaluate-risk.py scripts/lib/guard.py

      - name: Run risk evaluation (self-check)
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          # CI checks out a single branch; ensure local dev/main exist so
          # `git diff <target>` in the guard scripts never hits "unknown revision".
          # Prefer origin/dev when it exists, else fall back to origin/main.
          git show-ref --verify --quiet refs/heads/dev || (git show-ref --verify --quiet refs/remotes/origin/dev && git branch dev origin/dev || git branch dev origin/main)
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          python scripts/evaluate-risk.py --target dev
          python scripts/analyze-pull.py --target main

  release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}